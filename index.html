<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Multi-Tool Platform</title>
    <style>
        :root {
            --primary: #007bff;
            --primary-dark: #0056b3;
            --secondary: #6c757d;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --info: #17a2b8;
            --light: #f8f9fa;
            --dark: #343a40;
            --bg: #1a1a2e;
            --card-bg: #16213e;
            --text: #e4e4e4;
            --border: #2a2a4e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border-radius: 15px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }

        h1 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .subtitle {
            color: var(--secondary);
            font-size: 1.1rem;
        }

        .warning-banner {
            background: rgba(255, 193, 7, 0.1);
            border: 1px solid var(--warning);
            color: var(--warning);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin: 30px 0;
        }

        .tool-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 25px;
            transition: transform 0.3s, box-shadow 0.3s;
            cursor: pointer;
        }

        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 30px rgba(0, 123, 255, 0.2);
            border-color: var(--primary);
        }

        .tool-icon {
            font-size: 3rem;
            margin-bottom: 15px;
        }

        .tool-title {
            font-size: 1.5rem;
            color: var(--primary);
            margin-bottom: 10px;
        }

        .tool-description {
            color: var(--secondary);
            margin-bottom: 15px;
            line-height: 1.6;
        }

        .tool-status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .status-working {
            background: rgba(40, 167, 69, 0.2);
            color: var(--success);
            border: 1px solid var(--success);
        }

        .status-limited {
            background: rgba(255, 193, 7, 0.2);
            color: var(--warning);
            border: 1px solid var(--warning);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            border-radius: 20px;
            max-width: 900px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
            position: relative;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 2rem;
            cursor: pointer;
            color: var(--secondary);
            transition: color 0.3s;
        }

        .close-btn:hover {
            color: var(--danger);
        }

        .tool-interface {
            margin-top: 20px;
        }

        .input-group {
            margin: 20px 0;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: var(--text);
            font-weight: bold;
        }

        input, textarea, select {
            width: 100%;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
            margin-bottom: 15px;
        }

        input:focus, textarea:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        button {
            background: var(--primary);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            width: 100%;
            font-weight: bold;
        }

        button:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        button:disabled {
            background: var(--secondary);
            cursor: not-allowed;
            transform: none;
        }

        .result-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            min-height: 100px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .api-config {
            background: rgba(23, 162, 184, 0.1);
            border: 1px solid var(--info);
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .api-config h3 {
            color: var(--info);
            margin-bottom: 10px;
        }

        .feature-list {
            list-style: none;
            margin: 20px 0;
        }

        .feature-list li {
            padding: 10px;
            margin: 5px 0;
            background: rgba(40, 167, 69, 0.1);
            border-left: 3px solid var(--success);
            border-radius: 5px;
        }

        .error-message {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .success-message {
            background: rgba(40, 167, 69, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            margin-top: 50px;
            border-top: 1px solid var(--border);
            color: var(--secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 AI Multi-Tool Platform</h1>
            <p class="subtitle">Free AI-powered tools and utilities - No credit card required</p>
            <div class="warning-banner">
                ⚠️ **IMPORTANT**: This is a demonstration platform. All tools are for educational purposes only. 
                Free API keys required for AI features. Get yours at <strong>groq.com</strong> (free, no card needed).
            </div>
        </header>

        <div class="tools-grid">
            <!-- AI Chat Tool */
            <div class="tool-card" onclick="openTool('ai-chat')">
                <div class="tool-icon">🤖</div>
                <h3 class="tool-title">AI Chat Assistant</h3>
                <p class="tool-description">Chat with AI powered by Groq's free API. Fast, intelligent, and completely free.</p>
                <span class="tool-status status-working">✅ Working - Free API Required</span>
            </div>

            <!-- Password Generator */
            <div class="tool-card" onclick="openTool('password-generator')">
                <div class="tool-icon">🔐</div>
                <h3 class="tool-title">Password Generator</h3>
                <p class="tool-description">Generate secure, random passwords with custom length and complexity.</p>
                <span class="tool-status status-working">✅ Working - No API Required</span>
            </div>

            <!-- QR Code Generator */
            <div class="tool-card" onclick="openTool('qr-generator')">
                <div class="tool-icon">📱</div>
                <h3 class="tool-title">QR Code Generator</h3>
                <p class="tool-description">Create QR codes for URLs, text, or contact information.</p>
                <span class="tool-status status-working">✅ Working - No API Required</span>
            </div>

            <!-- Domain Lookup */
            <div class="tool-card" onclick="openTool('domain-lookup')">
                <div class="tool-icon">🌐</div>
                <h3 class="tool-title">Domain Information</h3>
                <p class="tool-description">Get domain registration information and DNS records.</p>
                <span class="tool-status status-limited">⚠️ Limited - Public Data Only</span>
            </div>

            <!-- Port Scanner */
            <div class="tool-card" onclick="openTool('port-scanner')">
                <div class="tool-icon">🔍</div>
                <h3 class="tool-title">Port Scanner</h3>
                <p class="tool-description">Scan for open ports on a target server (educational use only).</p>
                <span class="tool-status status-limited">⚠️ Limited - Browser Restrictions</span>
            </div>

            <!-- Crypto Prices */
            <div class="tool-card" onclick="openTool('crypto-prices')">
                <div class="tool-icon">💰</div>
                <h3 class="tool-title">Crypto Price Tracker</h3>
                <p class="tool-description">Real-time cryptocurrency prices and market data.</p>
                <span class="tool-status status-working">✅ Working - Public API</span>
            </div>

            <!-- Text Analyzer */
            <div class="tool-card" onclick="openTool('text-analyzer')">
                <div class="tool-icon">📊</div>
                <h3 class="tool-title">Text Analyzer</h3>
                <p class="tool-description">Analyze text for word count, readability, and sentiment.</p>
                <span class="tool-status status-working">✅ Working - No API Required</span>
            </div>

            <!-- URL Decoder */
            <div class="tool-card" onclick="openTool('url-tools')">
                <div class="tool-icon">🔗</div>
                <h3 class="tool-title">URL Tools</h3>
                <p class="tool-description">Encode/decode URLs, check URL safety, and analyze links.</p>
                <span class="tool-status status-working">✅ Working - No API Required</span>
            </div>
        </div>

        <footer>
            <p>🔒 All tools run in your browser or use free, public APIs. No data is stored.</p>
            <p>⚠️ For educational purposes only. Use responsibly.</p>
            <p>Hosted on GitHub Pages - Free forever</p>
        </footer>
    </div>

    <!-- Modal for Tool Interfaces */
    <div id="toolModal" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal()">&times;</span>
            <div id="toolInterface"></div>
        </div>
    </div>

    <script>
        // Tool configurations and interfaces
        const toolInterfaces = {
            'ai-chat': `
                <h2>🤖 AI Chat Assistant</h2>
                <div class="api-config">
                    <h3>API Configuration Required</h3>
                    <p>To use the AI chat, you need a free Groq API key:</p>
                    <ol>
                        <li>Go to <a href="https://console.groq.com" target="_blank" style="color: var(--info);">console.groq.com</a></li>
                        <li>Sign up with your GitHub account (free, no credit card)</li>
                        <li>Create an API key</li>
                        <li>Paste it below (stored locally in your browser)</li>
                    </ol>
                </div>
                <div class="input-group">
                    <label>Groq API Key (required):</label>
                    <input type="password" id="groqApiKey" placeholder="Enter your Groq API key">
                    <button onclick="saveApiKey()">Save API Key</button>
                </div>
                <div class="input-group">
                    <label>Message:</label>
                    <textarea id="chatMessage" rows="4" placeholder="Ask me anything..."></textarea>
                    <button onclick="sendChatMessage()" id="chatButton">Send Message</button>
                </div>
                <div class="result-box" id="chatResult">AI responses will appear here...</div>
            `,
            'password-generator': `
                <h2>🔐 Password Generator</h2>
                <div class="input-group">
                    <label>Password Length:</label>
                    <input type="number" id="passwordLength" min="8" max="128" value="16">
                </div>
                <div class="input-group">
                    <label>Options:</label>
                    <div style="margin: 10px 0;">
                        <input type="checkbox" id="includeUpper" checked> Include uppercase letters<br>
                        <input type="checkbox" id="includeLower" checked> Include lowercase letters<br>
                        <input type="checkbox" id="includeNumbers" checked> Include numbers<br>
                        <input type="checkbox" id="includeSymbols" checked> Include symbols
                    </div>
                </div>
                <button onclick="generatePassword()">Generate Password</button>
                <div class="result-box" id="passwordResult">Generated password will appear here...</div>
            `,
            'qr-generator': `
                <h2>📱 QR Code Generator</h2>
                <div class="input-group">
                    <label>Content:</label>
                    <textarea id="qrContent" rows="3" placeholder="Enter URL, text, or contact info"></textarea>
                </div>
                <button onclick="generateQR()">Generate QR Code</button>
                <div class="result-box" id="qrResult">QR code will appear here...</div>
            `,
            'domain-lookup': `
                <h2>🌐 Domain Information Lookup</h2>
                <div class="input-group">
                    <label>Domain Name:</label>
                    <input type="text" id="domainName" placeholder="example.com">
                </div>
                <button onclick="lookupDomain()">Lookup Domain</button>
                <div class="result-box" id="domainResult">Domain information will appear here...</div>
            `,
            'port-scanner': `
                <h2>🔍 Port Scanner (Educational Use Only)</h2>
                <div class="error-message">
                    ⚠️ Browser limitations apply. This scanner uses JavaScript and can only scan limited ports due to security restrictions.
                </div>
                <div class="input-group">
                    <label>Target Host:</label>
                    <input type="text" id="scanTarget" placeholder="example.com or IP address">
                </div>
                <div class="input-group">
                    <label>Ports to Scan:</label>
                    <select id="portRange">
                        <option value="common">Common ports (21, 22, 23, 25, 80, 443)</option>
                        <option value="web">Web ports (80, 443, 8080, 8443)</option>
                        <option value="custom">Custom (enter below)</option>
                    </select>
                    <input type="text" id="customPorts" placeholder="21,22,23,25,80,443" style="display:none;">
                </div>
                <button onclick="scanPorts()">Scan Ports</button>
                <div class="result-box" id="scanResult">Scan results will appear here...</div>
            `,
            'crypto-prices': `
                <h2>💰 Cryptocurrency Price Tracker</h2>
                <div class="input-group">
                    <label>Select Cryptocurrency:</label>
                    <select id="cryptoSelect">
                        <option value="bitcoin">Bitcoin (BTC)</option>
                        <option value="ethereum">Ethereum (ETH)</option>
                        <option value="solana">Solana (SOL)</option>
                        <option value="binancecoin">Binance Coin (BNB)</option>
                    </select>
                </div>
                <button onclick="getCryptoPrice()">Get Price</button>
                <div class="result-box" id="cryptoResult">Price data will appear here...</div>
            `,
            'text-analyzer': `
                <h2>📊 Text Analyzer</h2>
                <div class="input-group">
                    <label>Text to Analyze:</label>
                    <textarea id="textToAnalyze" rows="6" placeholder="Enter text for analysis"></textarea>
                </div>
                <button onclick="analyzeText()">Analyze Text</button>
                <div class="result-box" id="textAnalysisResult">Analysis results will appear here...</div>
            `,
            'url-tools': `
                <h2>🔗 URL Tools</h2>
                <div class="input-group">
                    <label>URL:</label>
                    <input type="text" id="urlInput" placeholder="Enter URL to encode/decode/analyze">
                </div>
                <button onclick="encodeURL()">Encode URL</button>
                <button onclick="decodeURL()" style="margin-top: 10px;">Decode URL</button>
                <button onclick="analyzeURL()" style="margin-top: 10px;">Analyze URL Safety</button>
                <div class="result-box" id="urlResult">Results will appear here...</div>
            `
        };

        function openTool(toolId) {
            const modal = document.getElementById('toolModal');
            const toolInterface = document.getElementById('toolInterface');
            
            if (toolInterfaces[toolId]) {
                toolInterface.innerHTML = toolInterfaces[toolId];
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }
        }

        function closeModal() {
            const modal = document.getElementById('toolModal');
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('toolModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        // Tool implementations
        function saveApiKey() {
            const apiKey = document.getElementById('groqApiKey').value;
            if (apiKey) {
                localStorage.setItem('groqApiKey', apiKey);
                alert('API key saved successfully!');
            }
        }

        async function sendChatMessage() {
            const apiKey = localStorage.getItem('groqApiKey');
            if (!apiKey) {
                document.getElementById('chatResult').innerHTML = '❌ Please enter your Groq API key first.';
                return;
            }

            const message = document.getElementById('chatMessage').value;
            if (!message) {
                document.getElementById('chatResult').innerHTML = '❌ Please enter a message.';
                return;
            }

            const button = document.getElementById('chatButton');
            button.disabled = true;
            button.innerHTML = '<span class="loading"></span> Sending...';

            try {
                const response = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${apiKey}`,
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        model: 'llama-3.1-8b-instant',
                        messages: [{role: 'user', content: message}]
                    })
                });

                if (!response.ok) {
                    throw new Error('API request failed');
                }

                const data = await response.json();
                document.getElementById('chatResult').innerHTML = data.choices[0].message.content;
            } catch (error) {
                document.getElementById('chatResult').innerHTML = f'❌ Error: {error.message}';
            } finally {
                button.disabled = false;
                button.innerHTML = 'Send Message';
            }
        }

        function generatePassword() {
            const length = parseInt(document.getElementById('passwordLength').value);
            const includeUpper = document.getElementById('includeUpper').checked;
            const includeLower = document.getElementById('includeLower').checked;
            const includeNumbers = document.getElementById('includeNumbers').checked;
            const includeSymbols = document.getElementById('includeSymbols').checked;

            let chars = '';
            if (includeUpper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (includeLower) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (includeNumbers) chars += '0123456789';
            if (includeSymbols) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

            if (chars === '') {
                document.getElementById('passwordResult').innerHTML = '❌ Please select at least one character type.';
                return;
            }

            let password = '';
            for (let i = 0; i < length; i++) {
                password += chars.charAt(Math.floor(Math.random() * chars.length));
            }

            document.getElementById('passwordResult').innerHTML = `Generated Password:\n\n<strong>${password}</strong>\n\n⚠️ Save this password securely. It will not be shown again.`;
        }

        function generateQR() {
            const content = document.getElementById('qrContent').value;
            if (!content) {
                document.getElementById('qrResult').innerHTML = '❌ Please enter content for the QR code.';
                return;
            }

            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(content)}`;
            document.getElementById('qrResult').innerHTML = `QR Code Generated:\n\n<img src="${qrUrl}" alt="QR Code" style="max-width: 200px; display: block; margin: 20px auto;">\n\n⚠️ QR codes can be scanned by anyone. Don't include sensitive information.`;
        }

        function lookupDomain() {
            const domain = document.getElementById('domainName').value;
            if (!domain) {
                document.getElementById('domainResult').innerHTML = '❌ Please enter a domain name.';
                return;
            }

            document.getElementById('domainResult').innerHTML = `Domain lookup for: ${domain}\n\n⚠️ Due to browser security restrictions, full domain lookup requires a backend server. This is a limitation of static websites.\n\nFor real domain information, use:\n- whois.com\n- ICWHOIS\n- DNS lookup tools`;
        }

        function scanPorts() {
            document.getElementById('scanResult').innerHTML = '⚠️ Browser-based port scanning is limited due to security restrictions. JavaScript cannot directly scan ports.\n\nFor real port scanning, use:\n- nmap (command line)\n- Online port scanners\n- Dedicated security tools\n\nThis is a browser limitation, not a bug.';
        }

        async function getCryptoPrice() {
            const crypto = document.getElementById('cryptoSelect').value;
            
            try {
                const response = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${crypto}&vs_currencies=usd`);
                if (!response.ok) {
                    throw new Error('Failed to fetch price data');
                }
                
                const data = await response.json();
                const price = data[crypto].usd;
                document.getElementById('cryptoResult').innerHTML = `Current ${crypto.toUpperCase()} Price: $${price.toLocaleString()}\n\nData provided by CoinGecko API`;
            } catch (error) {
                document.getElementById('cryptoResult').innerHTML = `❌ Error: ${error.message}`;
            }
        }

        function analyzeText() {
            const text = document.getElementById('textToAnalyze').value;
            if (!text) {
                document.getElementById('textAnalysisResult').innerHTML = '❌ Please enter text to analyze.';
                return;
            }

            const wordCount = text.split(/\s+/).filter(word => word.length > 0).length;
            const characterCount = text.length;
            const sentenceCount = text.split(/[.!?]+/).filter(sentence => sentence.trim().length > 0).length;

            document.getElementById('textAnalysisResult').innerHTML = `Text Analysis Results:\n\nWords: ${wordCount}\nCharacters: ${characterCount}\nSentences: ${sentenceCount}\n\nAverage words per sentence: ${sentenceCount > 0 ? (wordCount / sentenceCount).toFixed(2) : 0}\n\n⚠️ Sentiment analysis requires AI API (not implemented in this demo).`;
        }

        function encodeURL() {
            const url = document.getElementById('urlInput').value;
            if (!url) {
                document.getElementById('urlResult').innerHTML = '❌ Please enter a URL.';
                return;
            }
            document.getElementById('urlResult').innerHTML = `Encoded URL:\n${encodeURIComponent(url)}`;
        }

        function decodeURL() {
            const url = document.getElementById('urlInput').value;
            if (!url) {
                document.getElementById('urlResult').innerHTML = '❌ Please enter a URL.';
                return;
            }
            try {
                document.getElementById('urlResult').innerHTML = `Decoded URL:\n${decodeURIComponent(url)}`;
            } catch {
                document.getElementById('urlResult').innerHTML = '❌ Invalid encoded URL';
            }
        }

        function analyzeURL() {
            const url = document.getElementById('urlInput').value;
            if (!url) {
                document.getElementById('urlResult').innerHTML = '❌ Please enter a URL.';
                return;
            }
            
            document.getElementById('urlResult').innerHTML = `URL Safety Analysis:\n\n⚠️ Real URL safety checking requires backend services and databases of known malicious sites.\n\nBasic checks:\n- URL length: ${url.length} characters\n- Contains "http": ${url.includes('http') ? 'Yes' : 'No'}\n- Contains "https": ${url.includes('https') ? 'Yes' : 'No'}\n\nFor real safety analysis, use:\n- Google Safe Browsing\n- VirusTotal\n- URLVoid`;
        }

        // Show custom ports input when selected
        document.addEventListener('DOMContentLoaded', function() {
            const portRange = document.getElementById('portRange');
            const customPorts = document.getElementById('customPorts');
            
            if (portRange && customPorts) {
                portRange.addEventListener('change', function() {
                    if (this.value === 'custom') {
                        customPorts.style.display = 'block';
                    } else {
                        customPorts.style.display = 'none';
                    }
                });
            }
        });
    </script>
</body>
</html>
