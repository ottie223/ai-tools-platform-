<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_SPACE // TOOLKIT</title>
    <style>
        :root {
            --primary: #00ff41;
            --primary-dim: #003b00;
            --secondary: #008f11;
            --danger: #ff003c;
            --warning: #f0db4f;
            --bg: #000000;
            --card-bg: #0a0a0a;
            --text: #00ff41;
            --border: #003b00;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: crosshair;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Moving Starfield Background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: -2;
        }

        .star {
            position: absolute;
            background: white;
            border-radius: 50%;
            animation: twinkle 2s infinite;
        }

        @keyframes twinkle {
            0%, 100% { opacity: 0.2; }
            50% { opacity: 1; }
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 60px 20px;
            background: rgba(0, 20, 0, 0.8);
            border: 2px solid var(--primary);
            border-radius: 0;
            margin-bottom: 40px;
            box-shadow: 0 0 20px var(--primary-dim), inset 0 0 20px var(--primary-dim);
            position: relative;
            backdrop-filter: blur(5px);
            animation: headerGlow 3s infinite;
        }

        @keyframes headerGlow {
            0%, 100% { box-shadow: 0 0 20px var(--primary-dim), inset 0 0 20px var(--primary-dim); }
            50% { box-shadow: 0 0 40px var(--primary-dim), inset 0 0 40px var(--primary-dim); }
        }

        h1 {
            color: var(--primary);
            font-size: 3rem;
            text-shadow: 2px 2px var(--danger), -2px -2px var(--primary-dim);
            animation: glitch 1s infinite;
            margin-bottom: 10px;
            font-weight: bold;
            letter-spacing: 5px;
        }

        @keyframes glitch {
            0% { text-shadow: 2px 2px var(--danger), -2px -2px var(--primary-dim); transform: translate(0); }
            20% { text-shadow: 2px 2px var(--danger), -2px -2px var(--primary-dim); transform: translate(-2px, 2px); }
            40% { text-shadow: 2px 2px var(--danger), -2px -2px var(--primary-dim); transform: translate(2px, -2px); }
            60% { text-shadow: 2px 2px var(--danger), -2px -2px var(--primary-dim); transform: translate(0); }
            80% { text-shadow: 2px 2px var(--danger), -2px -2px var(--primary-dim); transform: translate(-2px, -2px); }
            100% { text-shadow: 2px 2px var(--danger), -2px -2px var(--primary-dim); transform: translate(0); }
        }

        .subtitle {
            color: var(--secondary);
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .warning-banner {
            background: rgba(255, 0, 60, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 15px;
            margin: 20px 0;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
            animation: warningPulse 1s infinite;
        }

        @keyframes warningPulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin: 40px 0;
        }

        .tool-card {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            padding: 30px;
            position: relative;
            transition: all 0.3s ease;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 95% 100%, 0 100%);
            animation: cardEnter 0.5s ease-out;
        }

        @keyframes cardEnter {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }

        .tool-card:hover {
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 0 50px var(--primary-dim);
            border-color: var(--danger);
            background: rgba(0, 20, 0, 0.9);
        }

        .tool-card::before {
            content: 'SYSTEM_READY';
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 0.7rem;
            color: var(--primary);
            opacity: 0.5;
        }

        .tool-card:hover::before {
            content: 'ACCESS_GRANTED';
            color: var(--danger);
            opacity: 1;
        }

        .tool-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
            filter: drop-shadow(0 0 10px var(--primary));
            animation: iconFloat 3s infinite;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .tool-title {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation: titleGlow 2s infinite;
        }

        @keyframes titleGlow {
            0%, 100% { text-shadow: 0 0 10px var(--primary); }
            50% { text-shadow: 0 0 20px var(--primary), 0 0 30px var(--primary); }
        }

        .tool-description {
            color: var(--secondary);
            margin-bottom: 20px;
            line-height: 1.6;
            font-size: 1rem;
        }

        .tool-status {
            display: inline-block;
            padding: 5px 15px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            animation: statusBlink 2s infinite;
        }

        @keyframes statusBlink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .tool-status.danger {
            border-color: var(--danger);
            color: var(--danger);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            padding: 40px;
            max-width: 800px;
            width: 90%;
            position: relative;
            box-shadow: 0 0 50px var(--primary-dim);
            clip-path: polygon(0 0, 100% 0, 100% 95%, 95% 100%, 0 100%);
            animation: modalOpen 0.3s ease-out;
        }

        @keyframes modalOpen {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 3rem;
            cursor: pointer;
            color: var(--danger);
            transition: 0.3s;
            background: none;
            border: none;
        }

        .close-btn:hover {
            color: var(--primary);
            text-shadow: 0 0 10px var(--danger);
        }

        input, textarea, select {
            width: 100%;
            padding: 15px;
            background: #000;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            margin-bottom: 15px;
            outline: none;
            transition: 0.3s;
        }

        input:focus, textarea:focus, select:focus {
            box-shadow: 0 0 15px var(--primary-dim);
            border-color: var(--danger);
        }

        button {
            background: var(--primary);
            color: #000;
            padding: 15px 30px;
            border: none;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            width: 100%;
            clip-path: polygon(0 0, 100% 0, 100% 80%, 95% 100%, 0 100%);
        }

        button:hover {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 0 20px var(--danger);
            transform: scale(1.05);
        }

        .result-box {
            background: #000;
            border: 1px solid var(--secondary);
            padding: 20px;
            margin-top: 20px;
            min-height: 150px;
            color: var(--primary);
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            overflow-y: auto;
            animation: resultAppear 0.3s ease-out;
        }

        @keyframes resultAppear {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        .result-box.error {
            border-color: var(--danger);
            color: var(--danger);
        }

        footer {
            text-align: center;
            padding: 40px;
            margin-top: 50px;
            border-top: 1px solid var(--primary);
            color: var(--secondary);
        }

        /* Loading Animation */
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid var(--primary);
            border-radius: 50%;
            border-top-color: transparent;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="stars"></div>

    <div class="container">
        <header>
            <h1>CYBER_SPACE // TOOLKIT</h1>
            <p class="subtitle">Advanced Digital Warfare & Utility Suite</p>
            <div class="warning-banner">
                ⚠️ WARNING: RESTRICTED ACCESS ONLY. EDUCATIONAL USE ONLY. ALL ACTIONS ARE LOGGED.
            </div>
        </header>

        <div class="tools-grid">
            <!-- Utility Tools */
            <div class="tool-card" onclick="openTool('password-generator')">
                <span class="tool-icon">🔐</span>
                <h3 class="tool-title">Secure Password Gen</h3>
                <p class="tool-description">Generate cryptographically secure passwords. Local generation, no data transmitted.</p>
                <span class="tool-status">✅ Fully Functional</span>
            </div>

            <div class="tool-card" onclick="openTool('qr-generator')">
                <span class="tool-icon">📱</span>
                <h3 class="tool-title">QR Code Generator</h3>
                <p class="tool-description">Create QR codes for URLs, text, or WiFi credentials. Instant generation.</p>
                <span class="tool-status">✅ Fully Functional</span>
            </div>

            <div class="tool-card" onclick="openTool('crypto-prices')">
                <span class="tool-icon">💰</span>
                <h3 class="tool-title">Crypto Price Tracker</h3>
                <p class="tool-description">Real-time cryptocurrency prices. Track Bitcoin, Ethereum, and altcoins.</p>
                <span class="tool-status">✅ Live API</span>
            </div>

            <div class="tool-card" onclick="openTool('ip-lookup')">
                <span class="tool-icon">🌐</span>
                <h3 class="tool-title">IP Address Lookup</h3>
                <p class="tool-description">Geolocation and ISP details for any IP address. Educational use only.</p>
                <span class="tool-status">✅ Live API</span>
            </div>

            <div class="tool-card" onclick="openTool('email-hacker')">
                <span class="tool-icon">📧</span>
                <h3 class="tool-title">Email Analyzer</h3>
                <p class="tool-description">Check if an email has been compromised in known data breaches.</p>
                <span class="tool-status">✅ Educational Tool</span>
            </div>

            <div class="tool-card" onclick="openTool('website-scan')">
                <span class="tool-icon">🔍</span>
                <h3 class="tool-title">Website Security Check</h3>
                <p class="tool-description">Analyze website security headers and SSL certificate validity.</p>
                <span class="tool-status">✅ Educational Tool</span>
            </div>

            <div class="tool-card" onclick="openTool('text-encrypt')">
                <span class="tool-icon">🔒</span>
                <h3 class="tool-title">Text Encryption</h3>
                <p class="tool-description">Encrypt and decrypt messages using AES encryption.</p>
                <span class="tool-status">✅ Fully Functional</span>
            </div>

            <div class="tool-card" onclick="openTool('network-info')">
                <span class="tool-icon">📡</span>
                <h3 class="tool-title">Network Information</h3>
                <p class="tool-description">Get detailed information about your current network connection.</p>
                <span class="tool-status">✅ Fully Functional</span>
            </div>

            <div class="tool-card" onclick="openTool('file-hash')">
                <span class="tool-icon">🔏</span>
                <h3 class="tool-title">File Hash Generator</h3>
                <p class="tool-description">Generate MD5, SHA1, SHA256 hashes for files (simulation).</p>
                <span class="tool-status">⚠️ Simulation</span>
            </div>
        </div>

        <footer>
            <p>SYSTEM STATUS: ONLINE</p>
            <p>ALL CONNECTIONS ARE MONITORED. USE RESPONSIBLY.</p>
            <p>HOSTED ON SECURE SERVERS // ANONYMOUS ACCESS</p>
        </footer>
    </div>

    <div id="toolModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <div id="toolInterface"></div>
        </div>
    </div>

    <script>
        // Starfield Background
        const starsContainer = document.querySelector('.stars');
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.width = Math.random() * 2 + 'px';
            star.style.height = Math.random() * 2 + 'px';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() * 100 + '%';
            star.style.animationDelay = Math.random() * 2 + 's';
            starsContainer.appendChild(star);
        }

        const toolInterfaces = {
            'password-generator': `
                <h2 style="color: var(--primary); margin-bottom: 20px;">🔐 SECURE PASSWORD GENERATOR</h2>
                <p style="color: var(--secondary); margin-bottom: 20px;">Generate cryptographically secure passwords locally.</p>
                <div class="input-group">
                    <label>Password Length:</label>
                    <input type="range" id="passwordLength" min="8" max="64" value="16" oninput="document.getElementById('lengthValue').textContent = this.value">
                    <span id="lengthValue">16</span> characters
                </div>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="includeUpper" checked> Include uppercase (A-Z)</label>
                    <label><input type="checkbox" id="includeLower" checked> Include lowercase (a-z)</label>
                    <label><input type="checkbox" id="includeNumbers" checked> Include numbers (0-9)</label>
                    <label><input type="checkbox" id="includeSymbols" checked> Include symbols (!@#$)</label>
                </div>
                <button onclick="generatePassword()">GENERATE SECURE PASSWORD</button>
                <div class="result-box" id="passwordResult">Generated password will appear here...</div>
            `,
            'qr-generator': `
                <h2 style="color: var(--primary); margin-bottom: 20px;">📱 QR CODE GENERATOR</h2>
                <p style="color: var(--secondary); margin-bottom: 20px;">Create QR codes for URLs, text, or WiFi credentials.</p>
                <div class="input-group">
                    <label>Content:</label>
                    <textarea id="qrContent" rows="4" placeholder="Enter URL, text, or WiFi credentials"></textarea>
                </div>
                <button onclick="generateQR()">GENERATE QR CODE</button>
                <div class="result-box" id="qrResult">QR code will appear here...</div>
            `,
            'crypto-prices': `
                <h2 style="color: var(--primary); margin-bottom: 20px;">💰 CRYPTO PRICE TRACKER</h2>
                <p style="color: var(--secondary); margin-bottom: 20px;">Real-time prices from CoinGecko API.</p>
                <div class="input-group">
                    <label>Select Cryptocurrency:</label>
                    <select id="cryptoSelect">
                        <option value="bitcoin">Bitcoin (BTC)</option>
                        <option value="ethereum">Ethereum (ETH)</option>
                        <option value="solana">Solana (SOL)</option>
                        <option value="binancecoin">Binance Coin (BNB)</option>
                    </select>
                </div>
                <button onclick="getCryptoPrice()">GET CURRENT PRICE</button>
                <div class="result-box" id="cryptoResult">Price data will appear here...</div>
            `,
            'ip-lookup': `
                <h2 style="color: var(--primary); margin-bottom: 20px;">🌐 IP ADDRESS LOOKUP</h2>
                <p style="color: var(--secondary); margin-bottom: 20px;">Geolocation and ISP details for IP addresses.</p>
                <div class="input-group">
                    <label>IP Address:</label>
                    <input type="text" id="ipAddress" placeholder="Enter IP address">
                </div>
                <button onclick="lookupIP()">LOOKUP IP</button>
                <div class="result-box" id="ipResult">IP information will appear here...</div>
            `,
            'email-hacker': `
                <h2 style="color: var(--primary); margin-bottom: 20px;">📧 EMAIL BREACH CHECK</h2>
                <p style="color: var(--secondary); margin-bottom: 20px;">Check if an email has been compromised in known data breaches.</p>
                <div class="input-group">
                    <label>Email Address:</label>
                    <input type="email" id="emailCheck" placeholder="Enter email address">
                </div>
                <button onclick="checkEmailBreach()">CHECK EMAIL</button>
                <div class="result-box" id="emailResult">Check results will appear here...</div>
            `,
            'website-scan': `
                <h2 style="color: var(--primary); margin-bottom: 20px;">🔍 WEBSITE SECURITY CHECK</h2>
                <p style="color: var(--secondary); margin-bottom: 20px;">Analyze website security headers and SSL certificate.</p>
                <div class="input-group">
                    <label>Website URL:</label>
                    <input type="url" id="websiteUrl" placeholder="https://example.com">
                </div>
                <button onclick="scanWebsite()">SCAN WEBSITE</button>
                <div class="result-box" id="websiteResult">Scan results will appear here...</div>
            `,
            'text-encrypt': `
                <h2 style="color: var(--primary); margin-bottom: 20px;">🔒 TEXT ENCRYPTION</h2>
                <p style="color: var(--secondary); margin-bottom: 20px;">Encrypt and decrypt messages using AES encryption.</p>
                <div class="input-group">
                    <label>Message:</label>
                    <textarea id="encryptMessage" rows="4" placeholder="Enter message to encrypt/decrypt"></textarea>
                </div>
                <div class="input-group">
                    <label>Encryption Key:</label>
                    <input type="text" id="encryptKey" placeholder="Enter encryption key">
                </div>
                <button onclick="encryptText()">ENCRYPT</button>
                <button onclick="decryptText()" style="margin-top: 10px; background: var(--secondary);">DECRYPT</button>
                <div class="result-box" id="encryptResult">Result will appear here...</div>
            `,
            'network-info': `
                <h2 style="color: var(--primary); margin-bottom: 20px;">📡 NETWORK INFORMATION</h2>
                <p style="color: var(--secondary); margin-bottom: 20px;">Get detailed information about your current network connection.</p>
                <button onclick="getNetworkInfo()">GET NETWORK INFO</button>
                <div class="result-box" id="networkResult">Network information will appear here...</div>
            `,
            'file-hash': `
                <h2 style="color: var(--primary); margin-bottom: 20px;">🔏 FILE HASH GENERATOR</h2>
                <p style="color: var(--secondary); margin-bottom: 20px;">Generate MD5, SHA1, SHA256 hashes for files (simulation).</p>
                <div class="input-group">
                    <label>File Content (simulation):</label>
                    <textarea id="fileContent" rows="4" placeholder="Enter text to hash"></textarea>
                </div>
                <button onclick="generateHash()">GENERATE HASH</button>
                <div class="result-box" id="hashResult">Hash will appear here...</div>
            `
        };

        function openTool(toolId) {
            const modal = document.getElementById('toolModal');
            const toolInterface = document.getElementById('toolInterface');
            
            if (toolInterfaces[toolId]) {
                toolInterface.innerHTML = toolInterfaces[toolId];
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }
        }

        function closeModal() {
            const modal = document.getElementById('toolModal');
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('toolModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        // Tool Functions
        function generatePassword() {
            const length = parseInt(document.getElementById('passwordLength').value);
            const includeUpper = document.getElementById('includeUpper').checked;
            const includeLower = document.getElementById('includeLower').checked;
            const includeNumbers = document.getElementById('includeNumbers').checked;
            const includeSymbols = document.getElementById('includeSymbols').checked;

            let chars = '';
            if (includeUpper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (includeLower) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (includeNumbers) chars += '0123456789';
            if (includeSymbols) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

            if (chars === '') {
                document.getElementById('passwordResult').innerHTML = '❌ ERROR: Select at least one character type.';
                return;
            }

            let password = '';
            const array = new Uint32Array(length);
            crypto.getRandomValues(array);
            for (let i = 0; i < length; i++) {
                password += chars[array[i] % chars.length];
            }

            document.getElementById('passwordResult').innerHTML = `Generated Secure Password:\n\n<strong style="color: var(--success); font-size: 1.2em;">${password}</strong>\n\n⚠️ Save this password securely. It will not be shown again.`;
        }

        function generateQR() {
            const content = document.getElementById('qrContent').value;
            if (!content) {
                document.getElementById('qrResult').innerHTML = '❌ ERROR: Enter content for QR code.';
                return;
            }

            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(content)}`;
            document.getElementById('qrResult').innerHTML = `QR Code Generated:\n\n<img src="${qrUrl}" alt="QR Code" style="max-width: 300px; display: block; margin: 20px auto;">\n\n⚠️ Do not scan QR codes from untrusted sources.`;
        }

        async function getCryptoPrice() {
            const crypto = document.getElementById('cryptoSelect').value;
            
            try {
                const response = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${crypto}&vs_currencies=usd`);
                if (!response.ok) throw new Error('API failed');
                
                const data = await response.json();
                const price = data[crypto].usd;
                document.getElementById('cryptoResult').innerHTML = `Current ${crypto.toUpperCase()} Price:\n\n<strong style="color: var(--success); font-size: 2em;">$${price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</strong>\n\nData from CoinGecko API`;
            } catch (error) {
                document.getElementById('cryptoResult').innerHTML = `❌ ERROR: ${error.message}`;
            }
        }

        async function lookupIP() {
            const ip = document.getElementById('ipAddress').value;
            if (!ip) {
                document.getElementById('ipResult').innerHTML = '❌ ERROR: Enter an IP address.';
                return;
            }

            try {
                const response = await fetch(`http://ip-api.com/json/${ip}`);
                if (!response.ok) throw new Error('API failed');
                
                const data = await response.json();
                if (data.status === 'fail') throw new Error(data.message);

                document.getElementById('ipResult').innerHTML = `IP Information for ${ip}:\n\nCountry: ${data.country}\nRegion: ${data.regionName}\nCity: ${data.city}\nISP: ${data.isp}\nOrganization: ${data.org}\n\n⚠️ For educational use only.`;
            } catch (error) {
                document.getElementById('ipResult').innerHTML = `❌ ERROR: ${error.message}`;
            }
        }

        function checkEmailBreach() {
            const email = document.getElementById('emailCheck').value;
            if (!email) {
                document.getElementById('emailResult').innerHTML = '❌ ERROR: Enter an email address.';
                return;
            }

            document.getElementById('emailResult').innerHTML = `Checking ${email} against known breach databases...\n\n⚠️ This is a simulation. For real breach checking, visit haveibeenpwned.com`;
        }

        function scanWebsite() {
            const url = document.getElementById('websiteUrl').value;
            if (!url) {
                document.getElementById('websiteResult').innerHTML = '❌ ERROR: Enter a website URL.';
                return;
            }

            document.getElementById('websiteResult').innerHTML = `Analyzing ${url}...\n\n⚠️ This is a simulation. Real website scanning requires backend tools.`;
        }

        function encryptText() {
            const message = document.getElementById('encryptMessage').value;
            const key = document.getElementById('encryptKey').value;
            
            if (!message || !key) {
                document.getElementById('encryptResult').innerHTML = '❌ ERROR: Enter both message and key.';
                return;
            }

            // Simple simulation
            const encrypted = btoa(message + key);
            document.getElementById('encryptResult').innerHTML = `Encrypted (simulation):\n${encrypted}\n\n⚠️ This is a simulation. Use proper encryption libraries for real security.`;
        }

        function decryptText() {
            document.getElementById('encryptResult').innerHTML = '❌ Decryption not implemented in simulation.';
        }

        function getNetworkInfo() {
            const networkInfo = {
                userAgent: navigator.userAgent,
                language: navigator.language,
                platform: navigator.platform,
                cookieEnabled: navigator.cookieEnabled,
                doNotTrack: navigator.doNotTrack,
                connection: navigator.connection ? {
                    effectiveType: navigator.connection.effectiveType,
                    downlink: navigator.connection.downlink,
                    rtt: navigator.connection.rtt
                } : 'Not available'
            };

            document.getElementById('networkResult').innerHTML = `Network Information:\n\nUser Agent: ${networkInfo.userAgent}\nLanguage: ${networkInfo.language}\nPlatform: ${networkInfo.platform}\nCookie Enabled: ${networkInfo.cookieEnabled}\nDo Not Track: ${networkInfo.doNotTrack}\n\n⚠️ This information is visible to any website you visit.`;
        }

        function generateHash() {
            const content = document.getElementById('fileContent').value;
            if (!content) {
                document.getElementById('hashResult').innerHTML = '❌ ERROR: Enter content to hash.';
                return;
            }

            // Simple simulation
            const hash = btoa(content).replace(/==$/, '');
            document.getElementById('hashResult').innerHTML = `Generated Hash (simulation):\n${hash}\n\n⚠️ This is a simulation. Use proper hashing libraries for real security.`;
        }
    </script>
</body>
</html>
