<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Media Downloader</title>
    <style>
        :root {
            --primary: #007bff;
            --primary-dark: #0056b3;
            --secondary: #6c757d;
            --success: #28a745;
            --danger: #dc3545;
            --warning: #ffc107;
            --bg: #1a1a2e;
            --card-bg: #16213e;
            --text: #e4e4e4;
            --border: #2a2a4e;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        header {
            text-align: center;
            padding: 40px 20px;
            background: var(--card-bg);
            border-radius: 15px;
            margin-bottom: 30px;
            border: 1px solid var(--border);
        }

        h1 {
            color: var(--primary);
            margin-bottom: 10px;
            font-size: 2.5rem;
        }

        .subtitle {
            color: var(--secondary);
            font-size: 1.1rem;
        }

        .tool-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 15px;
            padding: 30px;
        }

        .input-group {
            margin: 20px 0;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: var(--text);
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 15px;
            border: 1px solid var(--border);
            border-radius: 10px;
            background: var(--bg);
            color: var(--text);
            font-size: 1rem;
            margin-bottom: 15px;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(0, 123, 255, 0.1);
        }

        button {
            background: var(--primary);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
            width: 100%;
            font-weight: bold;
        }

        button:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        button:disabled {
            background: var(--secondary);
            cursor: not-allowed;
            transform: none;
        }

        .result-box {
            background: var(--bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 20px;
            margin-top: 20px;
            min-height: 100px;
            white-space: pre-wrap;
            font-family: monospace;
            font-size: 0.9rem;
        }

        .error-message {
            background: rgba(220, 53, 69, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .success-message {
            background: rgba(40, 167, 69, 0.1);
            border: 1px solid var(--success);
            color: var(--success);
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        footer {
            text-align: center;
            padding: 40px 20px;
            margin-top: 50px;
            border-top: 1px solid var(--border);
            color: var(--secondary);
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>📥 Media Downloader</h1>
            <p class="subtitle">Download videos from social media platforms</p>
        </header>

        <div class="tool-card">
            <div class="input-group">
                <label>Enter Video URL:</label>
                <input type="text" id="videoUrl" placeholder="Paste TikTok, Instagram, or Facebook link here">
            </div>
            <button onclick="downloadVideo()" id="downloadButton">Download Video</button>
            <div class="result-box" id="result">Downloaded video link will appear here...</div>
        </div>

        <footer>
            <p>⚠️ For educational purposes only. Respect copyright laws.</p>
            <p>Hosted on GitHub Pages - Free forever</p>
        </footer>
    </div>

    <script>
        async function downloadVideo() {
            const url = document.getElementById('videoUrl').value;
            const resultBox = document.getElementById('result');
            const button = document.getElementById('downloadButton');

            if (!url) {
                resultBox.innerHTML = '❌ Please enter a valid URL.';
                return;
            }

            button.disabled = true;
            button.innerHTML = '<span class="loading"></span> Processing...';
            resultBox.innerHTML = 'Processing your request...';

            try {
                // Try TikTok first (using a public API)
                if (url.includes('tiktok.com')) {
                    const response = await fetch(`https://www.tiktokapi.link/api?url=${encodeURIComponent(url)}`);
                    if (!response.ok) {
                        throw new Error('Failed to process TikTok URL');
                    }
                    const data = await response.json();
                    if (data.status === 'success' && data.data.play) {
                        resultBox.innerHTML = `✅ **Success!**\n\nDownload Link: ${data.data.play}\n\n⚠️ This link may expire. Download immediately.`;
                    } else {
                        throw new Error('Could not extract video. The video might be private or the API is down.');
                    }
                } else {
                    resultBox.innerHTML = '❌ **Unsupported Platform**\n\nCurrently, only TikTok is supported with this free API.\n\nInstagram and Facebook require a paid backend server due to strict security.';
                }
            } catch (error) {
                resultBox.innerHTML = f'❌ Error: {error.message}.\n\nNote: Free APIs are unreliable. Instagram/Facebook require a paid server.';
            } finally {
                button.disabled = false;
                button.innerHTML = 'Download Video';
            }
        }
    </script>
</body>
</html>
