<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER_SPACE // HACKER_TOOLKIT</title>
    <style>
        :root {
            --primary: #00ff41;
            --primary-dim: #003b00;
            --secondary: #008f11;
            --danger: #ff003c;
            --warning: #f0db4f;
            --bg: #000000;
            --card-bg: #0a0a0a;
            --text: #00ff41;
            --border: #003b00;
            --glitch: #ff003c;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: crosshair;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* Moving Starfield Background */
        .stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: black;
            z-index: -2;
        }

        /* CRT Scanline Effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 2px, 3px 100%;
            z-index: 1000;
            pointer-events: none;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            position: relative;
            z-index: 1;
        }

        header {
            text-align: center;
            padding: 60px 20px;
            background: rgba(0, 20, 0, 0.8);
            border: 2px solid var(--primary);
            border-radius: 0;
            margin-bottom: 40px;
            box-shadow: 0 0 20px var(--primary-dim), inset 0 0 20px var(--primary-dim);
            position: relative;
            backdrop-filter: blur(5px);
        }

        h1 {
            color: var(--primary);
            font-size: 3rem;
            text-shadow: 2px 2px var(--danger), -2px -2px var(--primary-dim);
            animation: glitch 1s infinite;
            margin-bottom: 10px;
            font-weight: bold;
            letter-spacing: 5px;
        }

        .subtitle {
            color: var(--secondary);
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .warning-banner {
            background: rgba(255, 0, 60, 0.1);
            border: 1px solid var(--danger);
            color: var(--danger);
            padding: 15px;
            margin: 20px 0;
            text-align: center;
            font-weight: bold;
            text-transform: uppercase;
            animation: pulse 2s infinite;
        }

        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 25px;
            margin: 40px 0;
        }

        .tool-card {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            padding: 30px;
            position: relative;
            transition: all 0.3s;
            clip-path: polygon(0 0, 100% 0, 100% 85%, 95% 100%, 0 100%);
        }

        .tool-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 30px var(--primary-dim);
            border-color: var(--danger);
            background: rgba(0, 20, 0, 0.9);
        }

        .tool-card::before {
            content: 'SYSTEM_READY';
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 0.7rem;
            color: var(--primary);
            opacity: 0.5;
        }

        .tool-card:hover::before {
            content: 'ACCESS_GRANTED';
            color: var(--danger);
            opacity: 1;
        }

        .tool-icon {
            font-size: 4rem;
            margin-bottom: 20px;
            display: block;
            filter: drop-shadow(0 0 10px var(--primary));
        }

        .tool-title {
            font-size: 1.8rem;
            color: var(--primary);
            margin-bottom: 15px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .tool-description {
            color: var(--secondary);
            margin-bottom: 20px;
            line-height: 1.6;
            font-size: 1rem;
        }

        .tool-status {
            display: inline-block;
            padding: 5px 15px;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
        }

        .tool-status.danger {
            border-color: var(--danger);
            color: var(--danger);
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 2000;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(10px);
        }

        .modal-content {
            background: var(--card-bg);
            border: 2px solid var(--primary);
            padding: 40px;
            max-width: 800px;
            width: 90%;
            position: relative;
            box-shadow: 0 0 50px var(--primary-dim);
            clip-path: polygon(0 0, 100% 0, 100% 95%, 95% 100%, 0 100%);
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 20px;
            font-size: 3rem;
            cursor: pointer;
            color: var(--danger);
            transition: 0.3s;
            background: none;
            border: none;
        }

        .close-btn:hover {
            color: var(--primary);
            text-shadow: 0 0 10px var(--danger);
        }

        input, textarea, select {
            width: 100%;
            padding: 15px;
            background: #000;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-family: 'Courier New', monospace;
            font-size: 1rem;
            margin-bottom: 15px;
            outline: none;
        }

        input:focus, textarea:focus, select:focus {
            box-shadow: 0 0 15px var(--primary-dim);
            border-color: var(--danger);
        }

        button {
            background: var(--primary);
            color: #000;
            padding: 15px 30px;
            border: none;
            font-family: 'Courier New', monospace;
            font-weight: bold;
            font-size: 1.1rem;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.3s;
            width: 100%;
            clip-path: polygon(0 0, 100% 0, 100% 80%, 95% 100%, 0 100%);
        }

        button:hover {
            background: var(--danger);
            color: #fff;
            box-shadow: 0 0 20px var(--danger);
        }

        .result-box {
            background: #000;
            border: 1px solid var(--secondary);
            padding: 20px;
            margin-top: 20px;
            min-height: 150px;
            color: var(--primary);
            font-family: 'Courier New', monospace;
            white-space: pre-wrap;
            overflow-y: auto;
        }

        .result-box.error {
            border-color: var(--danger);
            color: var(--danger);
        }

        footer {
            text-align: center;
            padding: 40px;
            margin-top: 50px;
            border-top: 1px solid var(--primary);
            color: var(--secondary);
        }

        /* Animations */
        @keyframes glitch {
            0% { text-shadow: 2px 2px var(--danger), -2px -2px var(--primary-dim); }
            25% { text-shadow: -2px 2px var(--danger), 2px -2px var(--primary-dim); }
            50% { text-shadow: 2px -2px var(--danger), -2px 2px var(--primary-dim); }
            75% { text-shadow: -2px -2px var(--danger), 2px 2px var(--primary-dim); }
            100% { text-shadow: 2px 2px var(--danger), -2px -2px var(--primary-dim); }
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.5; }
            100% { opacity: 1; }
        }

        .console-log {
            font-size: 0.8rem;
            color: var(--secondary);
            margin-top: 10px;
            height: 100px;
            overflow: hidden;
            border: 1px solid var(--border);
            padding: 10px;
            display: none;
        }
    </style>
</head>
<body>
    <div class="stars"></div>
    <div class="scanlines"></div>

    <div class="container">
        <header>
            <h1>CYBER_SPACE // TOOLKIT</h1>
            <p class="subtitle">Advanced Digital Warfare & Utility Suite</p>
            <div class="warning-banner">
                ⚠️ WARNING: RESTRICTED ACCESS ONLY. EDUCATIONAL USE ONLY. ALL ACTIONS ARE LOGGED.
            </div>
        </header>

        <div class="tools-grid">
            <!-- Hacking Tools */
            <div class="tool-card" onclick="openTool('sms-bomber')">
                <span class="tool-icon">📱</span>
                <h3 class="tool-title">SMS Bomber (Sim)</h3>
                <p class="tool-description">Simulate a flood of SMS requests to a target number. Educational demonstration of bombing logic.</p>
                <span class="tool-status danger">⚠️ Simulation Only</span>
            </div>

            <div class="tool-card" onclick="openTool('email-bomber')">
                <span class="tool-icon">📧</span>
                <h3 class="tool-title">Email Bomber (Sim)</h3>
                <p class="tool-description">Simulate an email flooding attack. Visualizes how email bombs overwhelm servers.</p>
                <span class="tool-status danger">⚠️ Simulation Only</span>
            </div>

            <div class="tool-card" onclick="openTool('wifi-deauth')">
                <span class="tool-icon">📡</span>
                <h3 class="tool-title">WiFi Deauther (Sim)</h3>
                <p class="tool-description">Simulate a WiFi deauthentication attack. Shows how devices can be disconnected from networks.</p>
                <span class="tool-status danger">⚠️ Simulation Only</span>
            </div>

            <div class="tool-card" onclick="openTool('doxxing-check')">
                <span class="tool-icon">🕵️</span>
                <h3 class="tool-title">Doxxing Risk Check</h3>
                <p class="tool-description">Analyze a username for potential data leaks and exposed information across public databases.</p>
                <span class="tool-status">✅ Educational Tool</span>
            </div>

            <div class="tool-card" onclick="openTool('password-cracker')">
                <span class="tool-icon">🔓</span>
                <h3 class="tool-title">Password Cracker (Sim)</h3>
                <p class="tool-description">Visual simulation of a brute-force attack. Demonstrates why weak passwords are dangerous.</p>
                <span class="tool-status danger">⚠️ Simulation Only</span>
            </div>

            <!-- Utility Tools */
            <div class="tool-card" onclick="openTool('password-generator')">
                <span class="tool-icon">🔐</span>
                <h3 class="tool-title">Secure Password Gen</h3>
                <p class="tool-description">Generate cryptographically secure passwords. Local generation, no data transmitted.</p>
                <span class="tool-status">✅ Fully Functional</span>
            </div>

            <div class="tool-card" onclick="openTool('qr-generator')">
                <span class="tool-icon">📱</span>
                <h3 class="tool-title">QR Code Generator</h3>
                <p class="tool-description">Create QR codes for URLs, text, or WiFi credentials. Instant generation.</p>
                <span class="tool-status">✅ Fully Functional</span>
            </div>

            <div class="tool-card" onclick="openTool('crypto-prices')">
                <span class="tool-icon">💰</span>
                <h3 class="tool-title">Crypto Price Tracker</h3>
                <p class="tool-description">Real-time cryptocurrency prices. Track Bitcoin, Ethereum, and altcoins.</p>
                <span class="tool-status">✅ Live API</span>
            </div>

            <div class="tool-card" onclick="openTool('ip-lookup')">
                <span class="tool-icon">🌐</span>
                <h3 class="tool-title">IP Address Lookup</h3>
                <p class="tool-description">Geolocation and ISP details for any IP address. Educational use only.</p>
                <span class="tool-status">✅ Live API</span>
            </div>
        </div>

        <footer>
            <p>SYSTEM STATUS: ONLINE</p>
            <p>ALL CONNECTIONS ARE MONITORED. USE RESPONSIBLY.</p>
            <p>HOSTED ON SECURE SERVERS // ANONYMOUS ACCESS</p>
        </footer>
    </div>

    <div id="toolModal" class="modal">
        <div class="modal-content">
            <button class="close-btn" onclick="closeModal()">×</button>
            <div id="toolInterface"></div>
        </div>
    </div>

    <script>
        // Starfield Background
        const starsContainer = document.querySelector('.stars');
        for (let i = 0; i < 200; i++) {
            const star = document.createElement('div');
            star.style.position = 'absolute';
            star.style.width = Math.random() * 2 + 'px';
            star.style.height = Math.random() * 2 + 'px';
            star.style.background = 'white';
            star.style.borderRadius = '50%';
            star.style.left = Math.random() * 100 + '%';
            star.style.top = Math.random() 100 + '%';
            star.style.animation = `pulse ${Math.random() * 3 + 2}s infinite`;
            starsContainer.appendChild(star);
        }

        const toolInterfaces = {
            'sms-bomber': `
                <h2 style="color: var(--danger); margin-bottom: 20px;">📱 SMS BOMBER SIMULATION</h2>
                <p style="color: var(--secondary); margin-bottom: 20px;">Simulates sending multiple SMS requests. This is a visual demonstration only.</p>
                <div class="input-group">
                    <label>Target Phone Number:</label>
                    <input type="text" id="smsTarget" placeholder="+1234567890">
                </div>
                <div class="input-group">
                    <label>Number of Requests:</label>
                    <input type="number" id="smsCount" value="10" max="100">
                </div>
                <button onclick="startSmsBomber()">INITIATE BOMBING SEQUENCE</button>
                <div class="console-log" id="smsConsole"></div>
                <div class="result-box" id="smsResult">Simulation logs will appear here...</div>
            `,
            'email-bomber': `
                <h2 style="color: var(--danger); margin-bottom: 20px;">📧 EMAIL BOMBER SIMULATION</h2>
                <p style="color: var(--secondary); margin-bottom: 20px;">Simulates flooding an email inbox. Visual demonstration only.</p>
                <div class="input-group">
                    <label>Target Email:</label>
                    <input type="text" id="emailTarget" placeholder="target@example.com">
                </div>
                <button onclick="startEmailBomber()">INITIATE EMAIL FLOOD</button>
                <div class="console-log" id="emailConsole"></div>
                <div class="result-box" id="emailResult">Simulation logs will appear here...</div>
            `,
            'wifi-deauth': `
                <h2 style="color: var(--danger); margin-bottom: 20px;">📡 WiFi DEAUTH SIMULATION</h2>
                <p style="color: var(--secondary); margin-bottom: 20px;">Simulates sending deauthentication packets to WiFi networks.</p>
                <div class="input-group">
                    <label>Target SSID (Network Name):</label>
                    <input type="text" id="wifiTarget" placeholder="Enter network name">
                </div>
                <button onclick="startWifiDeauth">INITIATE DEAUTH ATTACK</button>
                <div class="console-log" id="wifiConsole"></div>
                <div class="result-box" id="wifiResult">Simulation logs will appear here...</div>
            `,
            'doxxing-check': `
                <h2 style="color: var(--primary); margin-bottom: 20px;">🕵️ DOXXING RISK ASSESSMENT</h2>
                <p style="color: var(--secondary); margin-bottom: 20px;">Check if a username appears in known data leaks (Simulation).</p>
                <div class="input-group">
                    <label>Username to Check:</label>
                    <input type="text" id="doxTarget" placeholder="Enter username">
                </div>
                <button onclick="checkDoxxingRisk()">SCAN DATABASES</button>
                <div class="result-box" id="doxResult">Scan results will appear here...</div>
            `,
            'password-cracker': `
                <h2 style="color: var(--danger); margin-bottom: 20px;">🔓 PASSWORD CRACKER SIMULATION</h2                <p style="color: var(--secondary); margin-bottom: 20px;">Visualizes a brute-force attack. Demonstrates why weak passwords fail.</p>
                <div class="input-group">
                    <label>Enter a 4-digit PIN to "crack":</label>
                    <input type="text" id="crackTarget" maxlength="4" placeholder="1234">
                </div>
                <button onclick="startPasswordCracker()">START BRUTE FORCE</button>
                <div class="console-log" id="crackConsole"></div>
                <div class="result-box" id="crackResult">Cracking simulation will appear here...</div>
            `,
            'password-generator': `
                <h2 style="color: var(--primary); margin-bottom: 20px;">🔐 SECURE PASSWORD GENERATOR</h2>
                <p style="color: var(--secondary); margin-bottom: 20px;">Generate cryptographically secure passwords locally.</p>
                <div class="input-group">
                    <label>Password Length:</label>
                    <input type="range" id="passwordLength" min="8" max="64" value="16" oninput="document.getElementById('lengthValue').textContent = this.value">
                    <span id="lengthValue">16</span> characters
                </div>
                <div class="checkbox-group">
                    <label><input type="checkbox" id="includeUpper" checked> Include uppercase (A-Z)</label>
                    <label><input type="checkbox" id="includeLower" checked> Include lowercase (a-z)</label>
                    <label><input type="checkbox" id="includeNumbers" checked> Include numbers (0-9)</label>
                    <label><input type="checkbox" id="includeSymbols" checked> Include symbols (!@#$)</label>
                </div>
                <button onclick="generatePassword()">GENERATE SECURE PASSWORD</button>
                <div class="result-box" id="passwordResult">Generated password will appear here...</div>
            `,
            'qr-generator': `
                <h2 style="color: var(--primary); margin-bottom: 20px;">📱 QR CODE GENERATOR</h2>
                <p style="color: var(--secondary); margin-bottom: 20px;">Create QR codes for URLs, text, or WiFi credentials.</p>
                <div class="input-group">
                    <label>Content:</label>
                    <textarea id="qrContent" rows="4" placeholder="Enter URL, text, or WiFi credentials"></textarea>
                </div>
                <button onclick="generateQR()">GENERATE QR CODE</button>
                <div class="result-box" id="qrResult">QR code will appear here...</div>
            `,
            'crypto-prices': `
                <h2 style="color: var(--primary); margin-bottom: 20px;">💰 CRYPTO PRICE TRACKER</h2>
                <p style="color: var(--secondary); margin-bottom: 20px;">Real-time prices from CoinGecko API.</p>
                <div class="input-group">
                    <label>Select Cryptocurrency:</label>
                    <select id="cryptoSelect">
                        <option value="bitcoin">Bitcoin (BTC)</option>
                        <option value="ethereum">Ethereum (ETH)</option>
                        <option value="solana">Solana (SOL)</option>
                        <option value="binancecoin">Binance Coin (BNB)</option>
                    </select>
                </div>
                <button onclick="getCryptoPrice()">GET CURRENT PRICE</button>
                <div class="result-box" id="cryptoResult">Price data will appear here...</div>
            `,
            'ip-lookup': `
                <h2 style="color: var(--primary); margin-bottom: 20px;">🌐 IP ADDRESS LOOKUP</h2>
                <p style="color: var(--secondary); margin-bottom: 20px;">Geolocation and ISP details for IP addresses.</p>
                <div class="input-group">
                    <label>IP Address:</label>
                    <input type="text" id="ipAddress" placeholder="Enter IP address">
                </div>
                <button onclick="lookupIP()">LOOKUP IP</button>
                <div class="result-box" id="ipResult">IP information will appear here...</div>
            `
        };

        function openTool(toolId) {
            const modal = document.getElementById('toolModal');
            const toolInterface = document.getElementById('toolInterface');
            
            if (toolInterfaces[toolId]) {
                toolInterface.innerHTML = toolInterfaces[toolId];
                modal.style.display = 'flex';
                document.body.style.overflow = 'hidden';
            }
        }

        function closeModal() {
            const modal = document.getElementById('toolModal');
            modal.style.display = 'none';
            document.body.style.overflow = 'auto';
        }

        window.onclick = function(event) {
            const modal = document.getElementById('toolModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        // Simulation Functions
        function startSmsBomber() {
            const target = document.getElementById('smsTarget').value;
            const count = parseInt(document.getElementById('smsCount').value);
            const consoleDiv = document.getElementById('smsConsole');
            const resultDiv = document.getElementById('smsResult');
            
            if (!target) {
                resultDiv.innerHTML = '❌ ERROR: Target number required.';
                resultDiv.classList.add('error');
                return;
            }

            consoleDiv.style.display = 'block';
            resultDiv.innerHTML = `Initiating SMS bombing sequence to ${target}...\n`;
            
            let sent = 0;
            const interval = setInterval(() {
                if (sent >= count) {
                    clearInterval(interval);
                    resultDiv.innerHTML += `\n✅ SIMULATION COMPLETE: ${count} requests sent to ${target}.\n⚠️ This was a simulation. No real SMS were sent.`;
                    return;
                }
                
                sent++;
                consoleDiv.innerHTML += `[${new Date().toLocaleTimeString()}] Sending request ${sent} to ${target}...\n`;
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
                resultDiv.innerHTML += `Request ${sent} sent...\n`;
            }, 100);
        }

        function startEmailBomber() {
            const target = document.getElementById('emailTarget').value;
            const consoleDiv = document.getElementById('emailConsole');
            const resultDiv = document.getElementById('emailResult');
            
            if (!target) {
                resultDiv.innerHTML = '❌ ERROR: Target email required.';
                resultDiv.classList.add('error');
                return;
            }

            consoleDiv.style.display = 'block';
            resultDiv.innerHTML = `Initiating email flood to ${target}...\n`;
            
            let sent = 0;
            const interval = setInterval(() {
                if (sent >= 20) {
                    clearInterval(interval);
                    resultDiv.innerHTML += `\n✅ SIMULATION COMPLETE: Flood attack simulated.\n⚠️ This was a simulation. No real emails were sent.`;
                    return;
                }
                
                sent++;
                consoleDiv.innerHTML += `[${new Date().toLocaleTimeString()}] Flooding ${target} with request ${sent}...\n`;
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
                resultDiv.innerHTML += `Packet ${sent} sent...\n`;
            }, 200);
        }

        function startWifiDeauth() {
            const target = document.getElementById('wifiTarget').value;
            const consoleDiv = document.getElementById('wifiConsole');
            const resultDiv = document.getElementById('wifiResult');
            
            if (!target) {
                resultDiv.innerHTML = '❌ ERROR: Target SSID required.';
                resultDiv.classList.add('error');
                return;
            }

            consoleDiv.style.display = 'block';
            resultDiv.innerHTML = `Initiating deauth attack on ${target}...\n`;
            
            let sent = 0;
            const interval = setInterval(() {
                if (sent >= 10) {
                    clearInterval(interval);
                    resultDiv.innerHTML += `\n✅ SIMULATION COMPLETE: Deauth packets sent.\n⚠️ This was a simulation. No real packets were sent.`;
                    return;
                }
                
                sent++;
                consoleDiv.innerHTML += `[${new Date().toLocaleTimeString()}] Sending deauth packet ${sent} to ${target}...\n`;
                consoleDiv.scrollTop = consoleDiv.scrollHeight;
                resultDiv.innerHTML += `Deauth packet ${sent} sent...\n`;
            }, 500);
        }

        function checkDoxxingRisk() {
            const target = document.getElementById('doxTarget').value;
            const resultDiv = document.getElementById('doxResult');
            
            if (!target) {
                resultDiv.innerHTML = '❌ ERROR: Username required.';
                resultDiv.classList.add('error');
                return;
            }

            resultDiv.innerHTML = `Scanning databases for "${target}"...\n`;
            
            setTimeout(() {
                resultDiv.innerHTML += `Checking public records...\n`;
            }, 1000);
            
            setTimeout(() {
                resultDiv.innerHTML += `Checking social media leaks...\n`;
            }, 2000);
            
            setTimeout(() {
                resultDiv.innerHTML += `Checking dark web forums...\n`;
            }, 3000);
            
            setTimeout(() {
                resultDiv.innerHTML += `\n✅ SCAN COMPLETE\n\nNo critical data found for "${target}" in public databases.\n⚠️ This is a simulation. Real doxxing requires paid APIs.`;
            }, 4000);
        }

        function startPasswordCracker() {
            const target = document.getElementById('crackTarget').value;
            const consoleDiv = document.getElementById('crackConsole');
            const resultDiv = document.getElementById('crackResult');
            
            if (!target || target.length !== 4) {
                resultDiv.innerHTML = '❌ ERROR: Enter a 4-digit PIN.';
                resultDiv.classList.add('error');
                return;
            }

            consoleDiv.style.display = 'block';
            resultDiv.innerHTML = `Starting brute-force attack on ${target}...\n`;
            
            let attempts = 0;
            const maxAttempts = 10000;
            
            const interval = setInterval(() {
                if (attempts >= maxAttempts) {
                    clearInterval(interval);
                    resultDiv.innerHTML += `\n✅ SIMULATION COMPLETE: Brute-force attack simulated.\n⚠️ Real cracking takes much longer for complex passwords.`;
                    return;
                }
                
                attempts++;
                const guess = Math.floor(Math.random() * 10000).toString().padStart(4, '0');
                
                if (attempts % 100 === 0) {
                    consoleDiv.innerHTML += `[${new Date().toLocaleTimeString()}] Attempt ${attempts}: ${guess}...\n`;
                    consoleDiv.scrollTop = consoleDiv.scrollHeight;
                }
                
                if (guess === target) {
                    clearInterval(interval);
                    resultDiv.innerHTML += `\n✅ PASSWORD CRACKED: ${target}\nAttempts: ${attempts}`;
                }
            }, 10);
        }

        // Real Tool Functions
        function generatePassword() {
            const length = parseInt(document.getElementById('passwordLength').value);
            const includeUpper = document.getElementById('includeUpper').checked;
            const includeLower = document.getElementById('includeLower').checked;
            const includeNumbers = document.getElementById('includeNumbers').checked;
            const includeSymbols = document.getElementById('includeSymbols').checked;

            let chars = '';
            if (includeUpper) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
            if (includeLower) chars += 'abcdefghijklmnopqrstuvwxyz';
            if (includeNumbers) chars += '0123456789';
            if (includeSymbols) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

            if (chars === '') {
                document.getElementById('passwordResult').innerHTML = '❌ ERROR: Select at least one character type.';
                return;
            }

            let password = '';
            const array = new Uint32Array(length);
            crypto.getRandomValues(array);
            for (let i = 0; i < length; i++) {
                password += chars[array[i] % chars.length];
            }

            document.getElementById('passwordResult').innerHTML = `Generated Secure Password:\n\n<strong style="color: var(--success); font-size: 1.2em;">${password}</strong>\n\n⚠️ Save this password securely. It will not be shown again.`;
        }

        function generateQR() {
            const content = document.getElementById('qrContent').value;
            if (!content) {
                document.getElementById('qrResult').innerHTML = '❌ ERROR: Enter content for QR code.';
                return;
            }

            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=${encodeURIComponent(content)}`;
            document.getElementById('qrResult').innerHTML = `QR Code Generated:\n\n<img src="${qrUrl}" alt="QR Code" style="max-width: 300px; display: block; margin: 20px auto;">\n\n⚠️ Do not scan QR codes from untrusted sources.`;
        }

        async function getCryptoPrice() {
            const crypto = document.getElementById('cryptoSelect').value;
            
            try {
                const response = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${crypto}&vs_currencies=usd`);
                if (!response.ok) throw new Error('API failed');
                
                const data = await response.json();
                const price = data[crypto].usd;
                document.getElementById('cryptoResult').innerHTML = `Current ${crypto.toUpperCase()} Price:\n\n<strong style="color: var(--success); font-size: 2em;">$${price.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</strong>\n\nData from CoinGecko API`;
            } catch (error) {
                document.getElementById('cryptoResult').innerHTML = `❌ ERROR: ${error.message}`;
            }
        }

        async function lookupIP() {
            const ip = document.getElementById('ipAddress').value;
            if (!ip) {
                document.getElementById('ipResult').innerHTML = '❌ ERROR: Enter an IP address.';
                return;
            }

            try {
                const response = await fetch(`http://ip-api.com/json/${ip}`);
                if (!response.ok) throw new Error('API failed');
                
                const data = await response.json();
                if (data.status === 'fail') throw new Error(data.message);

                document.getElementById('ipResult').innerHTML = `IP Information for ${ip}:\n\nCountry: ${data.country}\nRegion: ${data.regionName}\nCity: ${data.city}\nISP: ${data.isp}\nOrganization: ${data.org}\n\n⚠️ For educational use only.`;
            } catch (error) {
                document.getElementById('ipResult').innerHTML = `❌ ERROR: ${error.message}`;
            }
        }
    </script>
</body>
